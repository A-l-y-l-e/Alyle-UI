<div
  (slidestart)="touch && _onDragStart()"
  (slideleft)="touch && _onDrag($event)"
  (slideright)="touch && _onDrag($event)"
  (slidecancel)="touch && _onDragCancel()"
  (slideend)="touch && _onDragEnd($event)"
  #slideContainer
  >
  <div #_slide [className]="classes.slide">
    <ng-content></ng-content>
  </div>
  @if (lyItems.length !== 1 && hasNavigationIndicators) {
    <ol [className]="classes.indicators">
      @for (item of lyItems; track item; let i = $index) {
        <li
          [ngClass]="[classes.indicator, selectedIndex == i ? classes.indicatorActive : '']"
          (click)="_select(i)"
          >
          <span
            [class]="classes.indicatorIcon"
          ></span>
        </li>
      }
    </ol>
  }
  @if (hasNavigationArrows) {
    <div [class]="[classes.actions, classes.actionIcon, 'left']" (click)="prev()">
    </div>
  }
  @if (hasNavigationArrows) {
    <div [class]="[classes.actions, classes.actionIcon, 'right']" (click)="next()">
    </div>
  }
  @if (hasProgressBar && _isIntervalFn && interval && autoplay) {
    <div
      [className]="classes.barContainer"
      >
      <div
        [className]="classes.bar"
        #_progressBar
        [style.animation-duration]="interval + 'ms'"
      ></div>
    </div>
  }
</div>
