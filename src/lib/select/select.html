<div #valueText>
  @switch (empty) {
    @case (true) {
      <div [className]="classes.valueText">{{ '\u00A0' }}</div>
    }
    @default {
      <div [className]="classes.valueText">
        @switch (!!customTrigger) {
          @default {
            <span>{{ triggerValue || '\u00A0' }}</span>
          }
          @case (true) {
            <ng-content select="ly-select-trigger"></ng-content>
          }
        }
      </div>
    }
  }
</div>

<ng-template #templateRef let-getOverlay>
  <div
    #container
    tabindex="-1"
    role="listbox"
    [className]="classes.container"
    [@selectEnter]="'in'"
    (@selectEnter.done)="_panelDoneAnimatingStream.next({state: $event.toState, overlay: getOverlay()})"
    (keydown)="_handleKeydown($event)"
    [style.font-size.px]="_triggerFontSize"
    >
    <ng-content></ng-content>
  </div>
</ng-template>
