@if ((asyncTabs | async) === null) {
  Loading tabs...
}
<ly-tabs
  indicatorColor="accent"
  textColor="accent"
  [elevation]="4"
  >
  @for (tab of asyncTabs | async; track tab) {
    <ly-tab>
      <button ly-tab-label>{{ tab.label }}</button>
      <div [style.padding.px]="24">{{ tab.content }}</div>
    </ly-tab>
  }
</ly-tabs>
