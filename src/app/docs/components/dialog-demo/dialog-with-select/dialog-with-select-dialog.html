<h4 ly-dialog-title>Hi!</h4>
<div ly-dialog-content>
  <form [formGroup]="myForm"
    (ngSubmit)="onSubmit()"
    >
    <ly-field appearance="filled" fullWidth>
      <input lyNativeControl
        type="text"
        placeholder="Username"
        formControlName="username"
        >
      <ly-hint>Hint</ly-hint>
      @if (username.hasError('minlength')) {
        <ly-error>Min 5 characters</ly-error>
      }
      @if (username.hasError('maxlength')) {
        <ly-error>Max 32 characters</ly-error>
      }
      @if (username.hasError('required')) {
        <ly-error>Required</ly-error>
      }
      <ly-hint [align]="'after'">{{ username.value?.length || 0 }}/32</ly-hint>
    </ly-field>

    <ly-field appearance="filled" fullWidth>
      <ly-select placeholder="Select something"
        formControlName="option"
        >
        <ly-option value="opt-1">Item 1</ly-option>
        <ly-option value="opt-2">Item 2</ly-option>
        <ly-option value="opt-3">Item 3</ly-option>
      </ly-select>
      <ly-hint>Hint</ly-hint>
      <ly-error>Required</ly-error>
    </ly-field>

    <button ly-button
      bg="primary"
      raised
      type="submit"
      [disabled]="!myForm.valid"
    >Submit</button>
  </form>
</div>
