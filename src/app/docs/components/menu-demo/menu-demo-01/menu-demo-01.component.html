<button ly-button
  [lyMenuTriggerFor]="menuTemplateRef"
>Menu</button>

<ng-template #menuTemplateRef let-M>
  <ly-menu [ref]="M">
    @for (item of [null, null, null]; track item; let i = $index) {
      <button ly-button ly-menu-item>
        <span>Item {{ i + 1 }}</span>
      </button>
    }
  </ly-menu>
</ng-template>
