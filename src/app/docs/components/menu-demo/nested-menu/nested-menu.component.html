<button ly-button
  [lyMenuTriggerFor]="rootMenu"
>menu</button>

<ng-template #rootMenu let-M>
  <ly-menu
    [ref]="M"
    >
    <button ly-button ly-menu-item [lyMenuTriggerFor]="subMenu">Sub menu</button>
    <button ly-button ly-menu-item [lyMenuTriggerFor]="subMenu2">Sub menu 2</button>
    @for (item of [0, 0, 0, 0]; track item; let i = $index) {
      <button ly-button ly-menu-item>
        <span>Item {{ i + 1 }}</span>
      </button>
    }
  </ly-menu>
</ng-template>

<ng-template #subMenu let-T>
  <ly-menu
    [ref]="T"
    >
    @for (item of [0, 0, 0, 0]; track item; let i = $index) {
      <button ly-button ly-menu-item>
        <span>Item {{ i + 1 }}</span>
      </button>
    }
  </ly-menu>
</ng-template>

<ng-template #subMenu2 let-T>
  <ly-menu
    [ref]="T"
