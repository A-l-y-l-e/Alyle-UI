<button ly-button
  [lyMenuTriggerFor]="menu"
  [openOnHover]="true"
>Menu</button>

<ng-template #menu let-T>
  <ly-menu
    [ref]="T"
    [hasBackdrop]="false"
    >
    @for (item of [0, 0, 0, 0]; track item; let i = $index) {
      <button ly-button ly-menu-item>
        <span>Item {{ i + 1 }}</span>
      </button>
    }
  </ly-menu>
</ng-template>
