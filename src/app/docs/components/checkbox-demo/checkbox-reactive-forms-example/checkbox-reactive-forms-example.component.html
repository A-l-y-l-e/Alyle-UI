<h4>Select some fruits:</h4>

<form [formGroup]="myForm" (ngSubmit)="onSubmit()">
  <section [lyMy]="1">
    <ly-checkbox [lyMx]="1"
      [checked]="allChecked"
      (change)="setAll($event.checked)"
      [indeterminate]="indeterminate">
      Fruits
    </ly-checkbox>
    @for (option of options.controls; track option; let i = $index) {
      <div [lyMe]="3"
        formArrayName="options"
        >
        <ly-checkbox [formControlName]="i"
          (change)="updateAllCheckboxes()">
          {{ fruits[i].name }}
        </ly-checkbox>
      </div>
    }
    @if (myForm.dirty && options.hasError('minCheckboxes')) {
      <span [lyColor]="'warn'"
      >Select at least one fruit.</span>
    }
    <span>&nbsp;</span>
  </section>
  <section>
    <button ly-button [bg]="'primary'" raised type="submit">Submit</button>
  </section>
</form>

<section [lyMy]="2">
  <pre>{{ result | json }}</pre>
</section>
