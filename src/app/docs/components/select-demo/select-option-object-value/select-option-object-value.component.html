<ly-field appearance="outlined">
  <ly-label>Label</ly-label>
  <ly-select placeholder="Placeholder"
    [formControl]="fruitControl"
    multiple>
    @for (fruit of fruits; track fruit) {
      <ly-option
      [value]="fruit">{{ fruit.viewValue }}</ly-option>
    }
  </ly-select>
  <ly-hint>Hint</ly-hint>
  @if (fruitControl.hasError('required')) {
    <ly-error>Required</ly-error>
  }
</ly-field>

<pre>You selected: {{ fruitControl.value | json }}</pre>
