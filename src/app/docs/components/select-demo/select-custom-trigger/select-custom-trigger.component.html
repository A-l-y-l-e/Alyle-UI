<ly-field>
  <ly-select placeholder="Label" [formControl]="fruits" multiple>
    <ly-select-trigger>
      {{fruits.value ? fruits.value[0] : ''}}
      @if (fruits.value?.length > 1) {
        <span>
          (+{{fruits.value.length - 1}} {{fruits.value?.length === 2 ? 'other' : 'others'}})
        </span>
      }
    </ly-select-trigger>
    @for (fruit of fruitList; track fruit) {
      <ly-option [value]="fruit">{{ fruit }}</ly-option>
    }
  </ly-select>
</ly-field>
